<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Appuntamenti</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --pink:    #e91e8c;
    --pink-d:  #c4167a;
    --dark:    #111113;
    --mid:     #1e1e22;
    --surface: #1a1a1f;
    --card:    #212128;
    --border:  #2e2e38;
    --text:    #f0f0f0;
    --weak:    #70707a;
    --green:   #34d058;
    --green-d: #26a044;
    --radius:  18px;
  }
  html, body { height: 100%; background: var(--dark); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }

  .screen { position: fixed; inset: 0; display: flex; flex-direction: column; }

  /* ── HEADER ── */
  .header {
    flex-shrink: 0; padding: 20px 24px 16px;
    background: var(--surface); border-bottom: 1px solid var(--border);
  }
  .header-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .header-left { display: flex; flex-direction: column; gap: 2px; }
  .header-eyebrow { font-size: .65rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; color: var(--weak); }
  .header-title { font-size: 1.4rem; font-weight: 800; letter-spacing: -.03em; }
  .header-right { display: flex; align-items: center; gap: 8px; }

  .arrived-badge {
    display: none; align-items: center; gap: 7px;
    background: rgba(233,30,140,.12); border: 1.5px solid rgba(233,30,140,.4);
    border-radius: 50px; padding: 6px 14px;
  }
  .arrived-badge.visible { display: flex; }
  .arrived-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--pink);
    animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.3;transform:scale(.7)} }
  .arrived-badge-text { font-size: .8rem; font-weight: 700; color: var(--pink); }

  .store-select {
    max-width: 220px; padding: 6px 10px; border-radius: 8px; font-size: .72rem; font-weight: 600;
    border: 1.5px solid var(--border); background: var(--mid); color: var(--text); font-family: inherit; outline: none;
  }
  .store-select:focus { border-color: var(--pink); }
  .btn-debug {
    padding: 6px 12px; border-radius: 8px; font-size: .7rem; font-weight: 700;
    border: 1.5px solid var(--border); background: none; color: var(--weak);
    cursor: pointer; letter-spacing: .04em; transition: all .15s; white-space: nowrap;
  }
  .btn-debug.active { border-color: #f59e0b; color: #f59e0b; background: rgba(245,158,11,.1); }

  /* ── CONTENT ── */
  .content { flex: 1; overflow-y: auto; min-height: 0; padding: 16px 20px 28px; }

  /* Section headers */
  .section-hd {
    font-size: .68rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .12em; color: var(--weak); margin: 20px 0 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-hd::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .section-hd:first-child { margin-top: 0; }

  /* ── APPOINTMENT CARD ── */
  .appt-card {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border-radius: var(--radius);
    border: 1.5px solid var(--border); padding: 16px 18px;
    margin-bottom: 10px; transition: border-color .2s, box-shadow .2s;
    position: relative; overflow: hidden;
  }
  .appt-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 4px; background: var(--border); border-radius: 4px 0 0 4px;
    transition: background .2s;
  }
  .appt-card.is-arrived { border-color: rgba(233,30,140,.5); box-shadow: 0 0 0 1px rgba(233,30,140,.15), 0 4px 20px rgba(233,30,140,.08); }
  .appt-card.is-arrived::before { background: var(--pink); }
  .appt-card.is-in_progress { border-color: rgba(52,208,88,.4); }
  .appt-card.is-in_progress::before { background: var(--green); }
  .appt-card.is-done { opacity: .55; }
  .appt-card.is-done::before { background: var(--weak); }

  /* Avatar */
  .appt-avatar {
    width: 48px; height: 48px; border-radius: 14px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 800; letter-spacing: -.02em;
    background: var(--mid); color: var(--weak);
    transition: background .2s, color .2s;
  }
  .is-arrived .appt-avatar  { background: rgba(233,30,140,.15); color: var(--pink); }
  .is-in_progress .appt-avatar { background: rgba(52,208,88,.12); color: var(--green); }

  /* Info */
  .appt-info { flex: 1; min-width: 0; }
  .appt-name { font-size: 1rem; font-weight: 700; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
  .appt-meta { font-size: .78rem; color: var(--weak); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .appt-meta-sep { color: var(--border); }
  .appt-status-line { font-size: .75rem; font-weight: 700; margin-top: 5px; display: flex; align-items: center; gap: 5px; }
  .appt-status-line.arrived { color: var(--pink); }
  .appt-status-line.in_progress { color: var(--green); }
  .appt-status-line.done { color: var(--weak); }
  .appt-status-dot {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0;
  }
  .is-arrived .appt-status-dot { animation: pulse 1.4s ease-in-out infinite; }

  /* Time badge */
  .appt-time-badge {
    flex-shrink: 0; text-align: center;
    background: var(--mid); border-radius: 10px; padding: 8px 12px;
    min-width: 56px;
  }
  .appt-time-val { font-size: 1rem; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .appt-time-date { font-size: .62rem; color: var(--weak); margin-top: 3px; font-weight: 600; }

  /* Action button */
  .appt-action { flex-shrink: 0; }
  .btn-connect {
    padding: 11px 20px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--pink); color: #fff; font-size: .88rem; font-weight: 700;
    transition: background .15s, transform .1s; white-space: nowrap; line-height: 1;
  }
  .btn-connect:active { transform: scale(.97); }
  .btn-connect:hover { background: var(--pink-d); }
  .btn-connect.debug-mode { background: #b45309; }
  .btn-connect.debug-mode:hover { background: #92400e; }
  .btn-done {
    padding: 11px 18px; border-radius: 12px;
    border: 1.5px solid var(--border); background: none;
    color: var(--weak); font-size: .88rem; font-weight: 600;
    cursor: pointer; transition: all .15s; white-space: nowrap;
  }
  .btn-done:hover { border-color: var(--text); color: var(--text); }

  /* Empty */
  .empty { text-align: center; padding: 40px 16px; color: var(--weak); font-size: .9rem; }

  /* Test bar */
  .test-bar {
    flex-shrink: 0; padding: 8px 20px; border-top: 1px solid var(--border);
    background: var(--surface); display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .test-label { font-size: .6rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; color: var(--weak); white-space: nowrap; }
  .btn-test {
    padding: 6px 12px; border-radius: 8px; border: 1.5px solid var(--border);
    background: none; color: var(--weak); font-size: .72rem; font-weight: 600;
    cursor: pointer; white-space: nowrap; transition: all .15s;
  }
  .btn-test:hover { border-color: var(--pink); color: var(--pink); }

  /* Days chips */
  .days-row { display: flex; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .day-chip {
    padding: 5px 14px; border-radius: 50px; border: 1.5px solid var(--border);
    background: none; color: var(--weak); font-size: .72rem; font-weight: 700;
    cursor: pointer; transition: all .15s; font-family: inherit; white-space: nowrap;
  }
  .day-chip:hover { border-color: var(--pink); color: var(--pink); }
  .day-chip.active { border-color: var(--pink); background: rgba(233,30,140,.12); color: var(--pink); }

  /* Refresh bar */
  .refresh-bar { flex-shrink: 0; text-align: center; padding: 5px;
    font-size: .62rem; color: var(--border); border-top: 1px solid var(--border); }

  /* Toast */
  .toast { position: fixed; bottom: 60px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #2a2a32; border: 1px solid var(--border); color: var(--text);
    padding: 10px 20px; border-radius: 50px; font-size: .82rem; font-weight: 600;
    opacity: 0; transition: opacity .22s, transform .22s;
    pointer-events: none; white-space: nowrap; z-index: 300; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Debug overlay */
  .debug-overlay {
    display: none; position: fixed; inset: 0; z-index: 500;
    background: rgba(0,0,0,.85); align-items: flex-end; justify-content: center;
  }
  .debug-overlay.show { display: flex; }
  .debug-panel {
    background: var(--card); border: 1px solid #f59e0b;
    border-radius: 20px 20px 0 0; width: 100%; max-width: 520px;
    padding: 22px 22px 36px;
  }
  .debug-panel-title {
    font-size: .65rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .1em; color: #f59e0b; margin-bottom: 12px;
  }
  .debug-payload {
    background: #111; border-radius: 10px; padding: 14px;
    font-family: 'SF Mono', 'Fira Code', monospace; font-size: .8rem;
    color: #d4d4d4; white-space: pre; overflow-x: auto;
    margin-bottom: 16px; line-height: 1.6;
  }
  .debug-actions { display: flex; gap: 10px; }
  .btn-debug-send {
    flex: 1; padding: 14px; border-radius: 12px; border: none; cursor: pointer;
    background: var(--pink); color: #fff; font-size: .9rem; font-weight: 700;
    transition: background .15s;
  }
  .btn-debug-send:hover { background: var(--pink-d); }
  .btn-debug-cancel {
    padding: 14px 22px; border-radius: 12px;
    border: 1.5px solid var(--border); background: none;
    color: var(--weak); font-size: .9rem; font-weight: 600; cursor: pointer;
  }
</style>
</head>
<body>
<div class="screen">
  <div class="header">
    <div class="header-top">
      <div class="header-left">
        <div class="header-eyebrow" id="storeLabel">Dashboard</div>
        <div class="header-title" id="headerTitle">Appuntamenti</div>
      </div>
      <div class="header-right">
        <div class="arrived-badge" id="arrivedBadge">
          <div class="arrived-dot"></div>
          <span class="arrived-badge-text" id="arrivedBadgeText"></span>
        </div>
        <select class="store-select" id="storeSelect" onchange="changeStore(this.value)" style="display:none"></select>
        <button class="btn-debug" id="btnDebug" onclick="toggleDebug()">DEBUG</button>
      </div>
    </div>
    <div class="days-row" id="daysRow">
      <button class="day-chip" onclick="setDays(1)">Oggi</button>
      <button class="day-chip" onclick="setDays(3)">3 giorni</button>
      <button class="day-chip active" onclick="setDays(7)">7 giorni</button>
      <button class="day-chip" onclick="setDays(14)">14 giorni</button>
      <button class="day-chip" onclick="setDays(30)">30 giorni</button>
    </div>
  </div>

  <div class="content" id="content"></div>

  <div class="test-bar">
    <span class="test-label">Test PunchOut</span>
    <button class="btn-test" onclick="testCustomerSelected('001Hn00002FIiKIIA1', 'mariolino.rossi@test.com')">ID+email</button>
    <button class="btn-test" onclick="testCustomerSelected(null, 'mariolino.rossi@test.com')">solo email</button>
    <button class="btn-test" onclick="testCustomerSelected('001Hn00002FIiKIIA1', null)">solo ID</button>
  </div>
  <div class="refresh-bar">Aggiornamento tra <span id="refreshCountdown">15</span>s</div>
</div>

<!-- Debug overlay -->
<div class="debug-overlay" id="debugOverlay">
  <div class="debug-panel">
    <div class="debug-panel-title">⚠ Debug — Payload che verrebbe inviato</div>
    <div class="debug-payload" id="debugPayloadText"></div>
    <div class="debug-actions">
      <button class="btn-debug-send" onclick="debugSend()">Invia comunque →</button>
      <button class="btn-debug-cancel" onclick="debugCancel()">Annulla</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let _data = [];
let _days = 7;
let _countdown = 15;
let _timer = null;
let _debugMode = false;
let _pendingApptId = null;
let _pendingEmail = null;

function toggleDebug() {
  _debugMode = !_debugMode;
  document.getElementById('btnDebug').classList.toggle('active', _debugMode);
  render();
  showToast(_debugMode ? 'Debug ON' : 'Debug OFF');
}

function setDays(n) {
  _days = n;
  document.querySelectorAll('.day-chip').forEach(el => {
    el.classList.toggle('active', el.getAttribute('onclick') === `setDays(${n})`);
  });
  document.getElementById('headerTitle').textContent = n === 1 ? 'Appuntamenti Oggi' : `Appuntamenti — ${n} giorni`;
  fetchData();
  startCountdown();
}

// ── Store context: ?store=alcott-xxx (set in the POS punchout URL), fallback to selector + localStorage
const _qs = new URLSearchParams(window.location.search);
let _store = _qs.get('store') || localStorage.getItem('alcott_store') || '';
let _storeName = '';
if (_qs.get('store')) localStorage.setItem('alcott_store', _store);

async function initStores() {
  const selEl = document.getElementById('storeSelect');
  try {
    const res = await fetch('/api/stores');
    const data = await res.json();
    if (!data.ok) throw new Error(data.error);
    const cur = data.stores.find(s => s.code === _store);
    _storeName = cur ? cur.name : '';
    document.getElementById('storeLabel').textContent = _storeName ? `Dashboard · ${prettyName(_storeName)}` : 'Dashboard';
    if (!_qs.get('store')) {
      selEl.innerHTML = '<option value="">— negozio —</option>' + data.stores.map(s =>
        `<option value="${esc(s.code)}" ${s.code === _store ? 'selected' : ''}>${esc(s.city)} — ${esc(prettyName(s.name))}</option>`).join('');
      selEl.style.display = '';
    }
  } catch(e) { console.error(e); showToast('Negozi non disponibili'); }
}

function changeStore(code) {
  _store = code;
  localStorage.setItem('alcott_store', code);
  initStores(); fetchData(); startCountdown();
}

function prettyName(n) {
  return String(n||'').toLowerCase().replace(/\b([a-zà-ÿ])/g, c => c.toUpperCase()).replace(/\bCc\b/g, 'CC');
}

async function fetchData() {
  if (!_store) {
    _data = [];
    document.getElementById('content').innerHTML = '<div class="empty">Seleziona il negozio in alto a destra.</div>';
    return;
  }
  try {
    const res = await fetch(`/api/appointments?store=${encodeURIComponent(_store)}&days=${_days}`);
    const data = await res.json();
    if (!Array.isArray(data)) throw new Error(data.error || 'Errore CRM');
    _data = data;
    render();
  } catch(e) { console.error(e); showToast(e.message || 'Errore di aggiornamento'); }
}

function startCountdown() {
  clearInterval(_timer);
  _countdown = 15;
  document.getElementById('refreshCountdown').textContent = _countdown;
  _timer = setInterval(() => {
    _countdown--;
    document.getElementById('refreshCountdown').textContent = _countdown;
    if (_countdown <= 0) { fetchData(); _countdown = 15; }
  }, 1000);
}

function initials(name) {
  const parts = (name || '').trim().split(/\s+/);
  if (parts.length >= 2) return (parts[0][0] + parts[1][0]).toUpperCase();
  return (parts[0] || '?').slice(0, 2).toUpperCase();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function render() {
  const pending     = _data.filter(a => a.status === 'pending');
  const arrived     = _data.filter(a => a.status === 'arrived');
  const in_progress = _data.filter(a => a.status === 'in_progress');
  const done        = _data.filter(a => a.status === 'done');

  const badge = document.getElementById('arrivedBadge');
  const badgeText = document.getElementById('arrivedBadgeText');
  if (arrived.length) {
    badge.classList.add('visible');
    badgeText.textContent = `${arrived.length} arrivat${arrived.length > 1 ? 'i' : 'o'}`;
  } else {
    badge.classList.remove('visible');
  }

  let html = '';

  if (_days > 1) {
    // Group by date
    const byDate = {};
    for (const a of _data) {
      const d = a.preferred_date || 'Senza data';
      if (!byDate[d]) byDate[d] = [];
      byDate[d].push(a);
    }
    const dates = Object.keys(byDate).sort();
    if (!dates.length) {
      html = '<div class="empty">Nessun appuntamento nel periodo selezionato.</div>';
    } else {
      for (const d of dates) {
        const label = d === 'Senza data' ? 'Senza data' : formatDateLabel(d);
        html += `<div class="section-hd">${label}</div>`;
        html += byDate[d].map(a => cardHtml(a)).join('');
      }
    }
  } else {
    // Single-day view grouped by status
    const allScheduled = [...arrived, ...pending];
    if (allScheduled.length) {
      html += `<div class="section-hd">Programmati</div>`;
      html += allScheduled.map(a => cardHtml(a)).join('');
    } else {
      html += `<div class="section-hd">Programmati</div><div class="empty">Nessun appuntamento in programma.</div>`;
    }
    if (in_progress.length) {
      html += `<div class="section-hd">In corso</div>`;
      html += in_progress.map(a => cardHtml(a)).join('');
    }
    if (done.length) {
      html += `<div class="section-hd">Terminati</div>`;
      html += done.map(a => cardHtml(a)).join('');
    }
  }

  document.getElementById('content').innerHTML = html;
}

function cardHtml(a) {
  // Time badge
  let timeBadge = '';
  if (a.preferred_time || a.preferred_date) {
    const dateStr = a.preferred_date ? formatDateShort(a.preferred_date) : '';
    timeBadge = `<div class="appt-time-badge">
      <div class="appt-time-val">${a.preferred_time || '—'}</div>
      ${dateStr ? `<div class="appt-time-date">${dateStr}</div>` : ''}
    </div>`;
  }

  // Status line
  let statusLine = '';
  if (a.status === 'arrived' && a.arrived_at) {
    statusLine = `<div class="appt-status-line arrived"><div class="appt-status-dot"></div>Arrivato alle ${formatTime(a.arrived_at)}</div>`;
  } else if (a.status === 'in_progress') {
    statusLine = `<div class="appt-status-line in_progress"><div class="appt-status-dot"></div>Sessione in corso</div>`;
  } else if (a.status === 'done') {
    statusLine = `<div class="appt-status-line done"><div class="appt-status-dot"></div>Terminato</div>`;
  }

  // Meta (email only — date/time shown in badge)
  const metaParts = [];
  if (a.email) metaParts.push(`<span>${esc(a.email)}</span>`);

  // Action
  let action = '';
  if (a.status === 'arrived') {
    const dbgClass = _debugMode ? ' debug-mode' : '';
    const dbgLabel = _debugMode ? '🔍 Payload' : 'Connetti al POS';
    action = `<div class="appt-action"><button class="btn-connect${dbgClass}" onclick="connectCustomer('${a.id}','${esc(a.email)}')">${dbgLabel}</button></div>`;
  } else if (a.status === 'in_progress') {
    action = `<div class="appt-action"><button class="btn-done" onclick="closeAppointment('${a.id}')">Chiudi</button></div>`;
  }

  return `<div class="appt-card is-${a.status}">
    <div class="appt-avatar">${initials(a.name)}</div>
    <div class="appt-info">
      <div class="appt-name">${esc(a.name)}</div>
      ${metaParts.length ? `<div class="appt-meta">${metaParts.join('')}</div>` : ''}
      ${statusLine}
    </div>
    ${timeBadge}
    ${action}
  </div>`;
}

// ── ACTIONS ───────────────────────────────────────────────────────────────────
async function connectCustomer(id, email) {
  if (_debugMode) {
    _pendingApptId = id;
    _pendingEmail = email;
    const _a = _data.find(a => a.id === id);
    const preview = { command: 'CustomerSelected', debugMode: 0, customerId: (_a && _a.accountId) || '(verrà risolto da Salesforce)', alternateCustomerId: email };
    document.getElementById('debugPayloadText').textContent = JSON.stringify(preview, null, 2) + '\n\n⚠ customerId verrà sostituito con l\'ID SF al momento dell\'invio';
    document.getElementById('debugOverlay').classList.add('show');
    return;
  }
  await _doConnectCustomer(id, email);
}

async function _doConnectCustomer(id, email) {
  let sfId = email;
  const apptLinked = _data.find(a => a.id === id);
  if (apptLinked && apptLinked.accountId) {
    // Customer already linked to the appointment in Salesforce (Person Account)
    const payload = { command: 'CustomerSelected', debugMode: 0, customerId: apptLinked.accountId, alternateCustomerId: email };
    return sendCustomerSelected(payload, id);
  }
  try {
    const appt = apptLinked;
    const name = appt ? appt.name : '';
    const res = await fetch('/api/sf-customer', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        email,
        first_name: appt ? (appt.first_name || '') : '',
        last_name:  appt ? (appt.last_name  || '') : '',
        name:       appt ? (appt.name || '') : '',
      }),
    });
    const data = await res.json();
    if (data.ok) {
      sfId = data.id;
      if (data.created) showToast('Nuovo cliente creato su CRM');
    }
  } catch(e) {
    console.warn('[SF lookup failed, falling back to email]', e);
  }
  const payload = { command: 'CustomerSelected', debugMode: 0, customerId: sfId, alternateCustomerId: email };
  sendCustomerSelected(payload, id);
}

async function debugSend() {
  document.getElementById('debugOverlay').classList.remove('show');
  if (_pendingApptId && _pendingEmail) {
    const id = _pendingApptId, email = _pendingEmail;
    _pendingApptId = null; _pendingEmail = null;
    await _doConnectCustomer(id, email);
  }
}

function debugCancel() {
  document.getElementById('debugOverlay').classList.remove('show');
  _pendingApptId = null; _pendingEmail = null;
}

function sendCustomerSelected(payload, apptId) {
  console.log('[PunchOut CustomerSelected]', JSON.stringify(payload, null, 2));
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.CustomerSelected) {
    window.webkit.messageHandlers.CustomerSelected.postMessage(JSON.stringify(payload));
  } else {
    showToast('webkit non disponibile');
  }
  if (apptId) {
    fetch(`/api/appointment/${apptId}/accept`, { method: 'POST' })
      .then(() => { fetchData(); startCountdown(); });
  }
}

function testCustomerSelected(customerId, email) {
  const payload = { command: 'CustomerSelected', debugMode: 0 };
  if (customerId) payload.customerId = customerId;
  if (email) payload.alternateCustomerId = email;
  if (_debugMode) {
    _pendingApptId = null; _pendingEmail = null;
    document.getElementById('debugPayloadText').textContent = JSON.stringify(payload, null, 2);
    document.getElementById('debugOverlay').classList.add('show');
    return;
  }
  console.log('[PunchOut TEST]', JSON.stringify(payload, null, 2));
  if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.CustomerSelected) {
    window.webkit.messageHandlers.CustomerSelected.postMessage(JSON.stringify(payload));
    showToast('Inviato');
  } else {
    showToast('webkit non disponibile');
  }
}

function closeAppointment(id) {
  fetch(`/api/appointment/${id}/done`, { method: 'POST' })
    .then(() => { fetchData(); startCountdown(); });
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatDate(d) { const [y,m,day] = d.split('-'); return `${day}/${m}/${y}`; }
function formatDateShort(d) { const [y,m,day] = d.split('-'); return `${day}/${m}`; }
function formatDateLabel(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long' })
    .replace(/^./, c => c.toUpperCase());
}
function formatTime(iso) {
  return new Date(iso).toLocaleTimeString('it-IT', { hour: '2-digit', minute: '2-digit' });
}

let _toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('headerTitle').textContent = _days === 1 ? 'Appuntamenti Oggi' : `Appuntamenti — ${_days} giorni`;
initStores();
fetchData();
startCountdown();
</script>
